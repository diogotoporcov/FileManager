spring:
  application:
    name: filemanager-api
  datasource:
    url: jdbc:postgresql://${POSTGRES_HOST:localhost}:${POSTGRES_PORT:5432}/${POSTGRES_DB:filemanager}
    username: ${POSTGRES_USER:filemanager}
    password: ${POSTGRES_PASSWORD:filemanager}
    driver-class-name: org.postgresql.Driver
  jpa:
    hibernate:
      ddl-auto: validate
    show-sql: true
    properties:
      hibernate:
        format_sql: true
        dialect: org.hibernate.dialect.PostgreSQLDialect
  flyway:
    enabled: true
    locations: classpath:db/migration
    baseline-on-migrate: true
  kafka:
    bootstrap-servers: ${KAFKA_BOOTSTRAP_SERVERS:localhost:9092}
    producer:
      key-serializer: org.apache.kafka.common.serialization.StringSerializer
      value-serializer: org.springframework.kafka.support.serializer.JsonSerializer
  security:
    oauth2:
      resourceserver:
        jwt:
          issuer-uri: ${KEYCLOAK_ISSUER_URI:http://localhost:8082/realms/filemanager}

app:
  auth:
    provider-name: ${AUTH_PROVIDER_NAME:keycloak}
  kafka:
    topics:
      file-processing-requested: ${FILE_PROCESSING_REQUESTED_TOPIC:file.processing.requested}
  phash:
    threshold: ${PHASH_THRESHOLD:10}

filemanager:
  internal:
    api-token: ${INTERNAL_API_TOKEN:}

server:
  port: ${PORT_API:8081}

minio:
  endpoint: ${MINIO_ENDPOINT:http://localhost:9000}
  access-key: ${MINIO_ROOT_USER:admin}
  secret-key: ${MINIO_ROOT_PASSWORD:replace_with_password}
  bucket-name: ${MINIO_BUCKET_NAME:filemanager}

management:
  endpoints:
    web:
      exposure:
        include: health,info
  endpoint:
    health:
      show-details: when_authorized
      probes:
        enabled: true
  info:
    env:
      enabled: true

info:
  app:
    name: filemanager-api
    role: metadata-api
