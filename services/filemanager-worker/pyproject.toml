[project]
name = "filemanager-worker"
version = "0.1.0"
description = "FastAPI worker for FileManager: handles asynchronous file processing, fingerprinting, and duplicate detection"
authors = [
    { name = "Diogo Toporcov", email = "diogotoporcov@gmail.com" }
]
dependencies = [
    "fastapi>=0.111.0",
    "uvicorn>=0.30.1",
    "pydantic-settings>=2.2.1",
    "aiokafka>=0.10.0",
    "boto3>=1.34.0",
    "httpx>=0.27.0",
]
requires-python = ">=3.11"

[project.optional-dependencies]
test = [
    "pytest>=8.2.1",
    "httpx>=0.27.0",
    "pytest-asyncio>=0.23.7",
    "ruff>=0.4.0",
    "mypy>=1.10.0",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "auto"

[tool.mypy]
ignore_missing_imports = true
check_untyped_defs = true
plugins = ["pydantic.mypy"]
