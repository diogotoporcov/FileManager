spring:
  application:
    name: filemanager-api
  servlet:
    multipart:
      max-file-size: ${MAX_UPLOAD_FILE_SIZE:512MB}
      max-request-size: ${MAX_UPLOAD_REQUEST_SIZE:512MB}
  datasource:
    url: jdbc:postgresql://${POSTGRES_HOST:localhost}:${POSTGRES_PORT:5432}/${POSTGRES_DB:filemanager}
    username: ${POSTGRES_USER:}
    password: ${POSTGRES_PASSWORD:}
    driver-class-name: org.postgresql.Driver
  jpa:
    hibernate:
      ddl-auto: validate
    show-sql: ${SPRING_JPA_SHOW_SQL:false}
    properties:
      hibernate:
        format_sql: ${HIBERNATE_FORMAT_SQL:false}
        dialect: org.hibernate.dialect.PostgreSQLDialect
  flyway:
    enabled: true
    locations: classpath:db/migration
    baseline-on-migrate: true
  kafka:
    bootstrap-servers: ${KAFKA_BOOTSTRAP_SERVERS:localhost:9092}
    producer:
      key-serializer: org.apache.kafka.common.serialization.StringSerializer
      value-serializer: org.springframework.kafka.support.serializer.JsonSerializer
  security:
    oauth2:
      resourceserver:
        jwt:
          issuer-uri: ${KEYCLOAK_ISSUER_URI:http://localhost:8082/realms/filemanager}

app:
  processable-image-mime-types: ${PROCESSABLE_IMAGE_MIME_TYPES:image/apng,image/avif,image/bmp,image/gif,image/icns,image/jp2,image/jpeg,image/mpo,image/palm,image/png,image/sgi,image/tiff,image/vnd.adobe.photoshop,image/webp,image/x-icon,image/x-pcx,image/x-portable-anymap,image/x-tga,image/xbm,image/xpm}
  processable-audio-mime-types: ${PROCESSABLE_AUDIO_MIME_TYPES:audio/mpeg,audio/mp3,audio/wav,audio/x-wav,audio/wave,audio/vnd.wave,audio/flac,audio/x-flac,audio/ogg,audio/aac,audio/mp4,audio/x-m4a,audio/webm,audio/opus,audio/matroska,audio/x-matroska,audio/ac3,audio/3gpp,audio/3gpp2,audio/x-aiff,audio/aiff}
  auth:
    provider-name: ${AUTH_PROVIDER_NAME:keycloak}
    auto-link-existing-users: ${AUTH_AUTO_LINK_EXISTING_USERS:false}
    trusted-auto-link-providers: ${AUTH_TRUSTED_AUTO_LINK_PROVIDERS:}
    claims:
      email: ${AUTH_EMAIL_CLAIM:email}
      first-name: ${AUTH_FIRST_NAME_CLAIM:given_name}
      last-name: ${AUTH_LAST_NAME_CLAIM:family_name}
      email-verified: ${AUTH_EMAIL_VERIFIED_CLAIM:email_verified}
  kafka:
    topics:
      file-processing-checksum: ${FILE_PROCESSING_CHECKSUM_TOPIC:file.processing.checksum}
      file-processing-image: ${FILE_PROCESSING_IMAGE_TOPIC:file.processing.image}
      file-processing-audio: ${FILE_PROCESSING_AUDIO_TOPIC:file.processing.audio}
  processing:
    checksum:
      enabled: ${PROCESSING_CHECKSUM_ENABLED:true}
    image:
      phash-enabled: ${PROCESSING_IMAGE_PHASH_ENABLED:true}
      embedding-enabled: ${PROCESSING_IMAGE_EMBEDDING_ENABLED:${EMBEDDING_ENABLED:true}}
    audio:
      fingerprint-enabled: ${PROCESSING_AUDIO_FINGERPRINT_ENABLED:true}
  phash:
    threshold: ${PHASH_THRESHOLD:10}
    max-candidates: ${PHASH_MAX_CANDIDATES:5000}
  embedding:
    model-name: ${EMBEDDING_MODEL_NAME:openai/clip-vit-large-patch14}
    model-version: ${EMBEDDING_MODEL_VERSION:1}
    dimension: ${EMBEDDING_DIMENSION:768}
    similarity-threshold: ${EMBEDDING_SIMILARITY_THRESHOLD:0.20}
    max-candidates: ${EMBEDDING_MAX_CANDIDATES:5000}
  quota:
    user-bytes: ${USER_STORAGE_QUOTA_BYTES:16106127360}

file-transfer:
  presigned-download:
    enabled: ${FILE_TRANSFER_PRESIGNED_DOWNLOAD_ENABLED:true}
    ttl: ${FILE_TRANSFER_PRESIGNED_DOWNLOAD_TTL:5m}

duplicate-detection:
  exact:
    enabled: ${DUPLICATE_DETECTION_EXACT_ENABLED:true}
    page-size: ${DUPLICATE_DETECTION_EXACT_PAGE_SIZE:100}
    max-groups: ${DUPLICATE_DETECTION_EXACT_MAX_GROUPS:50}
  image-phash:
    enabled: ${DUPLICATE_DETECTION_IMAGE_PHASH_ENABLED:true}
    max-distance: ${DUPLICATE_DETECTION_IMAGE_PHASH_MAX_DISTANCE:10}
    page-size: ${DUPLICATE_DETECTION_IMAGE_PHASH_PAGE_SIZE:100}
    grouped-enabled: ${DUPLICATE_DETECTION_IMAGE_PHASH_GROUPED_ENABLED:false}
  image-embedding:
    enabled: ${DUPLICATE_DETECTION_IMAGE_EMBEDDING_ENABLED:true}
    max-distance: ${DUPLICATE_DETECTION_IMAGE_EMBEDDING_MAX_DISTANCE:0.20}
    page-size: ${DUPLICATE_DETECTION_IMAGE_EMBEDDING_PAGE_SIZE:100}
    search-window: ${DUPLICATE_DETECTION_IMAGE_EMBEDDING_SEARCH_WINDOW:1000}
    max-search-window: ${DUPLICATE_DETECTION_IMAGE_EMBEDDING_MAX_SEARCH_WINDOW:10000}
    grouped-enabled: ${DUPLICATE_DETECTION_IMAGE_EMBEDDING_GROUPED_ENABLED:false}
  audio-fingerprint:
    enabled: ${DUPLICATE_DETECTION_AUDIO_FINGERPRINT_ENABLED:true}
    page-size: ${DUPLICATE_DETECTION_AUDIO_FINGERPRINT_PAGE_SIZE:100}

filemanager:
  internal:
    api-token: ${INTERNAL_API_TOKEN:}

server:
  port: ${PORT_API:8081}

minio:
  endpoint: ${MINIO_ENDPOINT:http://localhost:9000}
  access-key: ${MINIO_ROOT_USER:}
  secret-key: ${MINIO_ROOT_PASSWORD:}
  bucket-name: ${MINIO_BUCKET_NAME:filemanager}

management:
  endpoints:
    web:
      exposure:
        include: health,info
  endpoint:
    health:
      show-details: when_authorized
      probes:
        enabled: true
  info:
    env:
      enabled: true

info:
  app:
    name: filemanager-api
    role: metadata-api
