spring:
  application:
    name: filemanager-api
  datasource:
    url: jdbc:postgresql://${POSTGRES_HOST:localhost}:${POSTGRES_PORT:5432}/${POSTGRES_DB:filemanager}
    username: ${POSTGRES_USER:}
    password: ${POSTGRES_PASSWORD:}
    driver-class-name: org.postgresql.Driver
  jpa:
    hibernate:
      ddl-auto: validate
    show-sql: ${SPRING_JPA_SHOW_SQL:false}
    properties:
      hibernate:
        format_sql: ${HIBERNATE_FORMAT_SQL:false}
        dialect: org.hibernate.dialect.PostgreSQLDialect
  flyway:
    enabled: true
    locations: classpath:db/migration
    baseline-on-migrate: true
  kafka:
    bootstrap-servers: ${KAFKA_BOOTSTRAP_SERVERS:localhost:9092}
    producer:
      key-serializer: org.apache.kafka.common.serialization.StringSerializer
      value-serializer: org.springframework.kafka.support.serializer.JsonSerializer
  security:
    oauth2:
      resourceserver:
        jwt:
          issuer-uri: ${KEYCLOAK_ISSUER_URI:http://localhost:8082/realms/filemanager}

app:
  processable-image-mime-types: ${PROCESSABLE_IMAGE_MIME_TYPES:image/apng,image/avif,image/bmp,image/gif,image/icns,image/jp2,image/jpeg,image/mpo,image/palm,image/png,image/sgi,image/tiff,image/vnd.adobe.photoshop,image/webp,image/x-icon,image/x-pcx,image/x-portable-anymap,image/x-tga,image/xbm,image/xpm}
  processable-video-mime-types: ${PROCESSABLE_VIDEO_MIME_TYPES:video/mp4,video/webm,video/quicktime}
  processable-audio-mime-types: ${PROCESSABLE_AUDIO_MIME_TYPES:audio/mpeg,audio/mp3,audio/wav,audio/x-wav,audio/flac,audio/ogg,audio/aac,audio/mp4,audio/x-m4a}
  auth:
    provider-name: ${AUTH_PROVIDER_NAME:keycloak}
    auto-link-existing-users: ${AUTH_AUTO_LINK_EXISTING_USERS:false}
    trusted-auto-link-providers: ${AUTH_TRUSTED_AUTO_LINK_PROVIDERS:}
    claims:
      email: ${AUTH_EMAIL_CLAIM:email}
      first-name: ${AUTH_FIRST_NAME_CLAIM:given_name}
      last-name: ${AUTH_LAST_NAME_CLAIM:family_name}
      email-verified: ${AUTH_EMAIL_VERIFIED_CLAIM:email_verified}
  kafka:
    topics:
      file-processing-requested: ${FILE_PROCESSING_REQUESTED_TOPIC:file.processing.requested}
  phash:
    threshold: ${PHASH_THRESHOLD:10}
    max-candidates: ${PHASH_MAX_CANDIDATES:5000}
  embedding:
    enabled: ${EMBEDDING_ENABLED:true}
    model-name: ${EMBEDDING_MODEL_NAME:openai/clip-vit-large-patch14}
    model-version: ${EMBEDDING_MODEL_VERSION:1}
    dimension: ${EMBEDDING_DIMENSION:768}
    similarity-threshold: ${EMBEDDING_SIMILARITY_THRESHOLD:0.20}
    max-candidates: ${EMBEDDING_MAX_CANDIDATES:5000}
  quota:
    user-bytes: ${USER_STORAGE_QUOTA_BYTES:16106127360}
    organization-bytes: ${ORGANIZATION_STORAGE_QUOTA_BYTES:107374182400}

filemanager:
  internal:
    api-token: ${INTERNAL_API_TOKEN:}

server:
  port: ${PORT_API:8081}

minio:
  endpoint: ${MINIO_ENDPOINT:http://localhost:9000}
  access-key: ${MINIO_ROOT_USER:}
  secret-key: ${MINIO_ROOT_PASSWORD:}
  bucket-name: ${MINIO_BUCKET_NAME:filemanager}

management:
  endpoints:
    web:
      exposure:
        include: health,info
  endpoint:
    health:
      show-details: when_authorized
      probes:
        enabled: true
  info:
    env:
      enabled: true

info:
  app:
    name: filemanager-api
    role: metadata-api
