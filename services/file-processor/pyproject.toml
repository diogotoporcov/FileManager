[project]
name = "filemanager-worker"
version = "0.1.0"
description = "FastAPI worker for FileManager: handles asynchronous file processing, fingerprinting, and duplicate detection"
authors = [
    { name = "Diogo Toporcov", email = "diogotoporcov@gmail.com" }
]
dependencies = [
    "fastapi>=0.136.3",
    "uvicorn>=0.48.0",
    "pydantic-settings>=2.14.1",
    "aiokafka>=0.10.0",
    "boto3>=1.43.18",
    "httpx>=0.28.1",
    "Pillow>=11.3.0",
    "ImageHash>=4.3.1",
    "numpy>=2.3.5",
    "tritonclient[grpc]>=2.68.0",
    "prometheus-client>=0.25.0",
]
requires-python = ">=3.11"

[build-system]
requires = ["setuptools>=80"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
where = ["."]
include = ["app*"]

[project.optional-dependencies]
test = [
    "pytest>=8.4.2",
    "httpx>=0.28.1",
    "pytest-asyncio>=1.4.0",
    "ruff>=0.15.15",
    "mypy>=2.1.0",
    "boto3-stubs[s3]>=1.43.18",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "auto"

[tool.mypy]
ignore_missing_imports = true
check_untyped_defs = true
plugins = ["pydantic.mypy"]
