services:
  filemanager-postgres:
    image: ${POSTGRES_IMAGE:-pgvector/pgvector:pg18}
    container_name: filemanager-postgres
    environment:
      POSTGRES_DB: ${POSTGRES_DB}
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
    ports:
      - "${PORT_POSTGRES}:5432"
    networks:
      - filemanager-network
    restart: unless-stopped

  filemanager-minio:
    image: ${MINIO_IMAGE:-minio/minio:RELEASE.2025-09-07T16-13-09Z}
    container_name: filemanager-minio
    command: server /data --console-address ":9001"
    environment:
      MINIO_ROOT_USER: ${MINIO_ROOT_USER}
      MINIO_ROOT_PASSWORD: ${MINIO_ROOT_PASSWORD}
    ports:
      - "${PORT_MINIO}:9000"
      - "${PORT_MINIO_CONSOLE}:9001"
    networks:
      - filemanager-network
    restart: unless-stopped

  filemanager-redpanda:
    image: ${REDPANDA_IMAGE:-docker.redpanda.com/redpandadata/redpanda:v25.3.11}
    container_name: filemanager-redpanda
    command:
      - redpanda
      - start
      - --overprovisioned
      - --smp
      - "1"
      - --memory
      - "1G"
      - --reserve-memory
      - "0M"
      - --node-id
      - "0"
      - --check=false
      - --kafka-addr
      - "PLAINTEXT://0.0.0.0:29092,OUTSIDE://0.0.0.0:9092"
      - --advertise-kafka-addr
      - "PLAINTEXT://filemanager-redpanda:29092,OUTSIDE://localhost:9092"
    ports:
      - "${PORT_REDPANDA}:9092"
    networks:
      - filemanager-network
    restart: unless-stopped

  filemanager-keycloak:
    image: ${KEYCLOAK_IMAGE:-quay.io/keycloak/keycloak:26.4}
    container_name: filemanager-keycloak
    command: start-dev
    environment:
      KEYCLOAK_ADMIN: ${KEYCLOAK_ADMIN}
      KEYCLOAK_ADMIN_PASSWORD: ${KEYCLOAK_ADMIN_PASSWORD}
    ports:
      - "${PORT_KEYCLOAK}:8080"
    networks:
      - filemanager-network
    restart: unless-stopped

  filemanager-triton:
    build:
      context: ./services/filemanager-triton
      args:
        TRITON_BASE_IMAGE: ${TRITON_BASE_IMAGE:-nvcr.io/nvidia/tritonserver:25.10-py3}
    image: ${TRITON_IMAGE:-filemanager-triton:local}
    container_name: filemanager-triton
    profiles:
      - triton
    ports:
      - "127.0.0.1:${PORT_TRITON_HTTP}:8000"
      - "127.0.0.1:${PORT_TRITON_GRPC}:8001"
      - "127.0.0.1:${PORT_TRITON_METRICS}:8002"
    expose:
      - "8000"
      - "8001"
      - "8002"
    networks:
      - filemanager-network
    gpus: ${TRITON_GPUS:-all}
    restart: unless-stopped

networks:
  filemanager-network:
    name: filemanager-network
    driver: bridge
