services:
  filemanager-postgres:
    image: pgvector/pgvector:pg16
    container_name: filemanager-postgres
    environment:
      POSTGRES_DB: ${POSTGRES_DB}
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
    ports:
      - "${PORT_POSTGRES}:5432"
    networks:
      - filemanager-network
    restart: unless-stopped

  filemanager-minio:
    image: minio/minio
    container_name: filemanager-minio
    command: server /data --console-address ":9001"
    environment:
      MINIO_ROOT_USER: ${MINIO_ROOT_USER}
      MINIO_ROOT_PASSWORD: ${MINIO_ROOT_PASSWORD}
    ports:
      - "${PORT_MINIO}:9000"
      - "${PORT_MINIO_CONSOLE}:9001"
    networks:
      - filemanager-network
    restart: unless-stopped

  filemanager-redpanda:
    image: docker.redpanda.com/redpandadata/redpanda:latest
    container_name: filemanager-redpanda
    command:
      - redpanda
      - start
      - --overprovisioned
      - --smp
      - "1"
      - --memory
      - "1G"
      - --reserve-memory
      - "0M"
      - --node-id
      - "0"
      - --check=false
      - --kafka-addr
      - "PLAINTEXT://0.0.0.0:29092,OUTSIDE://0.0.0.0:9092"
      - --advertise-kafka-addr
      - "PLAINTEXT://filemanager-redpanda:29092,OUTSIDE://localhost:9092"
    ports:
      - "${PORT_REDPANDA}:9092"
    networks:
      - filemanager-network
    restart: unless-stopped

  filemanager-keycloak:
    image: quay.io/keycloak/keycloak:latest
    container_name: filemanager-keycloak
    command: start-dev
    environment:
      KEYCLOAK_ADMIN: ${KEYCLOAK_ADMIN}
      KEYCLOAK_ADMIN_PASSWORD: ${KEYCLOAK_ADMIN_PASSWORD}
    ports:
      - "${PORT_KEYCLOAK}:8080"
    networks:
      - filemanager-network
    restart: unless-stopped

networks:
  filemanager-network:
    name: filemanager-network
    driver: bridge
