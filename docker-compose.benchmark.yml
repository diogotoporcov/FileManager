services:
  filemanager-benchmark-postgres:
    image: ${POSTGRES_IMAGE:-pgvector/pgvector:pg18}
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-filemanager_benchmark}
      POSTGRES_USER: ${POSTGRES_USER:-filemanager}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-filemanager}
    command:
      - postgres
      - -c
      - shared_preload_libraries=pg_stat_statements
      - -c
      - pg_stat_statements.track=all
    ports:
      - "${PORT_POSTGRES:-5432}:5432"
    profiles:
      - database
      - api
      - gateway
      - processing

  filemanager-benchmark-minio:
    image: ${MINIO_IMAGE:-minio/minio:RELEASE.2025-09-07T16-13-09Z}
    command: server /data --console-address ":9001"
    environment:
      MINIO_ROOT_USER: ${MINIO_ROOT_USER:-benchmark}
      MINIO_ROOT_PASSWORD: ${MINIO_ROOT_PASSWORD:-benchmark-secret}
    ports:
      - "${PORT_MINIO:-9000}:9000"
      - "${PORT_MINIO_CONSOLE:-9001}:9001"
    profiles:
      - transfer
      - processing

  filemanager-benchmark-redpanda:
    image: ${REDPANDA_IMAGE:-docker.redpanda.com/redpandadata/redpanda:v25.3.11}
    command:
      - redpanda
      - start
      - --overprovisioned
      - --smp
      - "1"
      - --memory
      - "1G"
      - --reserve-memory
      - "0M"
      - --node-id
      - "0"
      - --check=false
      - --kafka-addr
      - "PLAINTEXT://0.0.0.0:29092,OUTSIDE://0.0.0.0:9092"
      - --advertise-kafka-addr
      - "PLAINTEXT://filemanager-benchmark-redpanda:29092,OUTSIDE://localhost:${PORT_REDPANDA:-9092}"
    ports:
      - "${PORT_REDPANDA:-9092}:9092"
    profiles:
      - processing
