name: CI

on:
  push:
    branches: [ main, master, dev ]
  pull_request:
    branches: [ main, master, dev ]

jobs:
  java-ci:
    name: Java CI (Spring Boot)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up JDK 25
        uses: actions/setup-java@v4
        with:
          java-version: '25'
          distribution: 'temurin'

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v3

      - name: Make gradlew executable
        run: chmod +x gradlew

      - name: Run Checkstyle
        run: ./gradlew checkstyleMain

      - name: Run Tests
        run: ./gradlew test

      - name: Generate API Coverage Report
        run: ./gradlew :services:api:jacocoTestReport

      - name: Upload API Coverage Report
        uses: actions/upload-artifact@v4
        with:
          name: api-jacoco-report
          path: |
            services/api/build/reports/jacoco/test/html
            services/api/build/reports/jacoco/test/jacocoTestReport.xml

  python-ci:
    name: Python CI (Worker)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: 'pip'
          cache-dependency-path: 'services/file-processor/pyproject.toml'

      - name: Install dependencies
        run: |
          cd services/file-processor
          python -m pip install --upgrade pip
          pip install .[test]

      - name: Run Linting
        run: |
          cd services/file-processor
          ruff check .
          mypy app

      - name: Run Tests
        run: |
          cd services/file-processor
          python -m pytest
