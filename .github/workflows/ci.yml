name: CI

on:
  push:
    branches: [ main, master ]
  pull_request:
    branches: [ main, master ]

jobs:
  java-ci:
    name: Java CI (Spring Boot)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up JDK 25
        uses: actions/setup-java@v4
        with:
          java-version: '25'
          distribution: 'temurin'

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v3

      - name: Make gradlew executable
        run: chmod +x gradlew

      - name: Run Checkstyle
        run: ./gradlew checkstyleMain

      - name: Run Tests
        run: ./gradlew test

  python-ci:
    name: Python CI (Worker)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: 'pip'
          cache-dependency-path: 'services/filemanager-worker/pyproject.toml'

      - name: Install dependencies
        run: |
          cd services/filemanager-worker
          python -m pip install --upgrade pip
          pip install .[test]

      - name: Run Linting
        run: |
          cd services/filemanager-worker
          ruff check .
          mypy app

      - name: Run Tests
        run: |
          cd services/filemanager-worker
          python -m pytest
